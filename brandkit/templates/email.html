<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{margin:0;background:#eef2f7;color:#162033;font-family:{{ font_stack }}}
    .shell{max-width:{{ max_width }};margin:0 auto;background:#fff;box-shadow:0 16px 50px rgba(15,23,42,.14)}
    .header{height:{{ header_height }};padding:0 28px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,{{ primary }},#1d3f7d);color:#fff}
    .mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:{{ accent }};font-weight:800}
    .brand{font-size:18px;font-weight:750;letter-spacing:.01em}
    .body{padding:30px 32px 34px}.eyebrow{color:{{ primary }};font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{font-size:24px;line-height:1.3;margin:10px 0 18px;color:#101828}
    p{font-size:15px;line-height:1.75;margin:0 0 16px;color:#475467}
    .event{margin:22px 0;padding:15px 17px;border:1px solid #dce5f0;border-radius:12px;background:#f8fafc}
    .event small{display:block;color:#667085;margin-bottom:5px}.event strong{color:#162033}
    .button{display:inline-block;margin:7px 0 22px;padding:12px 20px;border-radius:10px;background:{{ primary }};color:#fff!important;font-weight:700}
    .foot{border-top:1px solid #e6ebf2;padding-top:18px;font-size:12px;color:#8b96a8}
  </style>
</head>
<body>
  <div class="shell">
    <div class="header"><div class="mark">A</div><div class="brand">{{ brand_name }}</div></div>
    <main class="body">
      <div class="eyebrow">SECURITY NOTICE</div>
      <h1>{{ subject_text }}</h1>
      <p>{{ greeting_text }}</p>
      <p>{{ body_text }}</p>
      <div class="event"><small>사건 참조</small><strong>{{ event_ref }}</strong></div>
      <div class="button" role="img" aria-label="비대화형 버튼 미리보기">{{ action_label }}</div>
      <p class="foot">{{ signoff_text }} · 본 메시지는 폐쇄형 합성 시뮬레이션입니다.</p>
    </main>
  </div>
</body>
</html>
